# Buildpack builds run in a pod per build, created in the namespace dedicated to builds.
# Never bind these rules in a namespace with other secrets: creating a pod there lets the builder read them through the pod spec.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $.Release.Name }}-builder
  namespace: {{ include "builder.build-namespace" $ }}

rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - get
      - list
      - watch
      - delete
      - deletecollection
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
      - get
  # Never grant get, list or deletecollection on secrets: list and deletecollection return the contents of every secret in the namespace.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
