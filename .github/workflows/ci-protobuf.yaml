name: Protobuf CI

on:
  push:
    branches:
      - "main"
    paths:
      - "api/**"
  pull_request:
    paths:
      - "api/**"

jobs:
  gen-diff:
    name: Check diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: buf
      - name: Generate code
        run: mise run gen:proto
      - name: Check diff
        run: git diff --exit-code

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: buf
      - name: Format proto files
        run: |
          if ! buf format --diff --exit-code; then
            echo "::error::Run 'buf format -w' to fix"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: buf
      - name: Lint proto files
        run: buf lint
